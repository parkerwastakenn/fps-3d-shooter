<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #speedometer {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: #00ff00;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border: 2px solid #00ff00;
            font-family: monospace;
            min-width: 200px;
        }
        #rpm {
            position: absolute;
            bottom: 40px;
            right: 40px;
            color: #ff6600;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border: 2px solid #ff6600;
            font-family: monospace;
            min-width: 200px;
        }
        #gear {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffff00;
            font-size: 36px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border: 2px solid #ffff00;
            font-family: monospace;
            font-weight: bold;
        }
        #controls {
            position: absolute;
            top: 40px;
            left: 40px;
            color: #aaaaaa;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 1px solid #aaaaaa;
            font-family: monospace;
            line-height: 1.6;
        }
        #info {
            position: absolute;
            top: 40px;
            right: 40px;
            color: #00ffff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 1px solid #00ffff;
            font-family: monospace;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="hud">
        <div id="controls">
            <div>W/↑ - Forward</div>
            <div>S/↓ - Backward</div>
            <div>A/← - Left</div>
            <div>D/→ - Right</div>
            <div>SPACE - Handbrake</div>
            <div>R - Reset Position</div>
        </div>
        <div id="gear">N</div>
        <div id="info">
            <div>Position: <span id="posX">0</span>, <span id="posY">0</span>, <span id="posZ">0</span></div>
        </div>
        <div id="speedometer">
            <div>Speed: <span id="speedValue">0</span> km/h</div>
            <div style="margin-top: 10px; height: 20px; background: rgba(0,255,0,0.2); border: 1px solid #00ff00; border-radius: 3px; overflow: hidden;">
                <div id="speedBar" style="height: 100%; width: 0%; background: #00ff00; transition: width 0.1s;"></div>
            </div>
        </div>
        <div id="rpm">
            <div>RPM: <span id="rpmValue">0</span></div>
            <div style="margin-top: 10px; height: 20px; background: rgba(255,102,0,0.2); border: 1px solid #ff6600; border-radius: 3px; overflow: hidden;">
                <div id="rpmBar" style="height: 100%; width: 0%; background: #ff6600; transition: width 0.1s;"></div>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
    <script src="car-game.js"></script>
</body>
</html>
